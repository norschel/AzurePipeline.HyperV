name: $(majorversion).$(minorversion).$(Rev:r)

resources:
- repo: self
  clean: true

pool:
  vmImage: 'windows-latest'

trigger:
- master

variables:
    majorversion: 9
    minorversion: 1
    PublisherID: 'Orschel'
    marketplaceServiceConnection: 'Marketplace-Orschel'

stages:
- stage: Build
  jobs:
  - job: BuildExtensionVariant
    displayName: "Build Azure DevOps extension variant"
    strategy:
      maxParallel: 4
      matrix:
        Preview_AzureDevOps:
          ExtensionName: 'Hyper-V (Private Preview 2)'
          ExtensionID: 'hyperv-preview'
          ExtensionCategory: 'Azure Pipelines'
          VsixFileSuffix: 'azurepipelines_preview'
          DropSuffix: 'Preview'
          ExtensionVisibility: 'public'
          TaskNameSuffix: '-preview'
          TaskFriendlyNameSuffix: ' (Preview)'
          TaskID: '3b1f2c6d-7a94-4e2b-9c15-2f8e6a0d4b7c'
        Public_AzureDevOps:
          ExtensionName: 'Hyper-V'
          ExtensionID: 'hyperv'
          ExtensionCategory: 'Azure Pipelines'
          VsixFileSuffix: 'azurepipelines'
          DropSuffix: 'AzD'
          ExtensionVisibility: 'public'
          TaskNameSuffix: ''
          TaskFriendlyNameSuffix: ''
          TaskID: ''

    steps:      
      - powershell: |
          # Azure DevOps task module needs to be located in ps_modules\VstsTaskSdk relative to the task script
          write-host "Create PS-Modules folder"
          $scriptFolder = "$(Build.SourcesDirectory)\src\HyperVServer\HyperVServer"
          $psModulesFolder = "$scriptFolder\ps_modules"
          mkdir $psModulesFolder
          write-host "Save VstsTaskSdk module into ps_modules folder"
          Save-Module -Name VstsTaskSdk -Path $psModulesFolder
          write-host "Copy VstsTaskSdk module into ps_modules\VstsTaskSdk folder"
          $sdk = Get-ChildItem -Path $psModulesFolder -Recurse -Filter VstsTaskSdk.psm1
          write-host "Found module:"
          $sdk

          $from =$sdk.Directory.FullName
          $to = "$psModulesFolder\VstsTaskSdk"

          write-host "Copy module from $from to $to :"
          Get-ChildItem -Path $from | % {
            Copy-Item $_.fullname $to -Recurse -Force -verbose
          }
          ls $to

          Remove-Item -Path $from -Recurse -Force
        displayName: 'Add VstsTaskSdk PowerShell SDK'

      - powershell: |
          $taskPath = "$(Build.SourcesDirectory)\src\HyperVServer\HyperVServer\task.json"
          write-host "Patch task.json at $taskPath"
          $task = Get-Content -Path $taskPath -Raw | ConvertFrom-Json

          $task.name = "$($task.name)$(TaskNameSuffix)"
          $task.friendlyName = "$($task.friendlyName)$(TaskFriendlyNameSuffix)"
          if ('$(TaskID)') { $task.id = '$(TaskID)' }

          # task.json only supports a 3-part version (Major.Minor.Patch)
          $versionParts = '$(Build.BuildNumber)'.Split('.')
          $task.version.Major = [int]$versionParts[0]
          $task.version.Minor = [int]$versionParts[1]
          $task.version.Patch = [int]$versionParts[2]

          # tfx rejects a UTF-8 BOM, which Windows PowerShell's Set-Content would add
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($taskPath, ($task | ConvertTo-Json -Depth 100), $utf8NoBom)
          write-host "Patched task.json:"
          Get-Content -Path $taskPath -Raw

          $manifestPath = "$(Build.SourcesDirectory)\src\HyperVServer\vss-extension.json"
          write-host "Patch vss-extension.json at $manifestPath"
          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json

          # Contribution name must match the patched task name
          foreach ($contribution in $manifest.contributions) {
            if ($contribution.properties.name) {
              $contribution.properties.name = "$($contribution.properties.name)$(TaskNameSuffix)"
            }
          }

          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 100), $utf8NoBom)
          write-host "Patched vss-extension.json:"
          Get-Content -Path $manifestPath -Raw
        displayName: 'Patch task.json variant metadata'

        #- task: ToreGroneng.ToreGroneng-PSScriptAnalyzer-Task.PSScriptAnalyzer-Task.PowerShell Script Analyzer@1
        #  displayName: 'Execute PsScriptAnalyzer '
        #  inputs:
        #      PsFolder: src/HyperVServer/HyperVServer
        #      ExcludeRules: 'PSAvoidUsingWriteHost'
        #      Severity: 'Error,Warning'

      - task: azdo-marketplace@6
        displayName: 'Package Extension - HyperV for Azure DevOps / Visual Studio Marketplace based deployment'
        inputs:
          operation: package
          workingDirectory: '$(Build.SourcesDirectory)/src/HyperVServer'
          manifestFile: vss-extension.json
          outputPath: '$(build.artifactstagingdirectory)\Orschel.HyperV_$(majorversion).$(minorversion)_$(VsixFileSuffix).vsix'
          publisherId: '$(PublisherID)'
          extensionVersion: '$(Build.BuildNumber)'
          extensionId: '$(ExtensionID)'
          extensionName: '$(ExtensionName)'
          updateTasksVersion: none
          extensionVisibility: '$(ExtensionVisibility)'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Pipeline Artifact : Extension'
        inputs:
          artifact: Extension-$(DropSuffix)
          targetPath: '$(build.artifactstagingdirectory)'

- stage: PublishPreview
  displayName: 'Publish private preview'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - job: PublishPreview
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: none

      - download: current
        artifact: Extension-Preview
        patterns: '**/*.vsix'

      - task: azdo-marketplace@6
        name: showPreview
        displayName: 'Resolve published extension metadata'
        continueOnError: true
        inputs:
          operation: show
          connectionType: PAT
          connectionNamePAT: '$(marketplaceServiceConnection)'
          publisherId: '$(PublisherID)'
          extensionId: 'hyperv-private-preview'

      - task: azdo-marketplace@6
        name: publishPreview
        displayName: 'Publish private preview to Marketplace'
        inputs:
          operation: publish
          connectionType: PAT
          connectionNamePAT: '$(marketplaceServiceConnection)'
          use: vsix
          vsixFile: '$(Pipeline.Workspace)/Extension-Preview/Orschel.HyperV_$(majorversion).$(minorversion)_azurepipelines_preview.vsix'
          noWaitValidation: true

      - task: azdo-marketplace@6
        displayName: 'Validate private preview'
        inputs:
          operation: waitForValidation
          connectionType: PAT
          connectionNamePAT: '$(marketplaceServiceConnection)'
          vsixFile: '$(Pipeline.Workspace)/Extension-Preview/Orschel.HyperV_$(majorversion).$(minorversion)_azurepipelines_preview.vsix'

- stage: PublishPublic
  displayName: 'Publish public'
  dependsOn: PublishPreview
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: PublishProduction
    environment: 'HyperV-Prod-Oschel'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              persistCredentials: true
              fetchDepth: 1

            - download: none

            - download: current
              artifact: Extension-AzD
              patterns: '**/*.vsix'

            - task: azdo-marketplace@6
              name: showProduction
              displayName: 'Resolve published extension metadata'
              continueOnError: true
              inputs:
                operation: show
                connectionType: PAT
                connectionNamePAT: '$(marketplaceServiceConnection)'
                publisherId: '$(PublisherID)'
                extensionId: 'hyperv'

            - task: azdo-marketplace@6
              name: publishProduction
              displayName: 'Publish public production extension to Marketplace'
              inputs:
                operation: publish
                connectionType: PAT
                connectionNamePAT: '$(marketplaceServiceConnection)'
                use: vsix
                vsixFile: '$(Pipeline.Workspace)/Extension-AzD/Orschel.HyperV_$(majorversion).$(minorversion)_azurepipelines.vsix'
                noWaitValidation: true

            - task: azdo-marketplace@6
              displayName: 'Validate production release'
              inputs:
                operation: waitForValidation
                connectionType: PAT
                connectionNamePAT: '$(marketplaceServiceConnection)'
                vsixFile: '$(Pipeline.Workspace)/Extension-AzD/Orschel.HyperV_$(majorversion).$(minorversion)_azurepipelines.vsix'

            - pwsh: |
                $ErrorActionPreference = 'Stop'
                $tag = "v$env:RELEASE_MAJOR"
                $remoteTag = @(git ls-remote --tags origin "refs/tags/$tag")
                if ($LASTEXITCODE -ne 0) { throw 'Cannot read existing release tag.' }
                $previousTarget = if ($remoteTag.Count -gt 0) { ($remoteTag[0] -split '\s+')[0] } else { '' }
                git -c user.name='Azure Pipelines' -c user.email='azure-pipelines@local' tag --force --annotate $tag $env:RELEASE_COMMIT --message "Release $env:RELEASE_VERSION"
                if ($LASTEXITCODE -ne 0) { throw 'Cannot create release tag.' }
                git push origin "refs/tags/$tag" "--force-with-lease=refs/tags/${tag}:$previousTarget"
                if ($LASTEXITCODE -ne 0) { throw 'Cannot push release tag.' }
              displayName: 'Update major release tag'
              env:
                RELEASE_MAJOR: $(majorversion)
                RELEASE_VERSION: $(Build.BuildNumber)
                RELEASE_COMMIT: $(Build.SourceVersion)

